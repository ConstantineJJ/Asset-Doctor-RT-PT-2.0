[package]
name = "ad-formats"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ad-document = { path = "../ad-document", version = "=2.8.0" }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = "=1.0.229"
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }

[lints]
workspace = true

[dev-dependencies]
# Rig tests compare joint matrices; same pinned version as ad-document.
glam = { version = "=0.34.3", default-features = false, features = ["std"] }
