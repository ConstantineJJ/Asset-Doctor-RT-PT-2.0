[package]
name = "ad-update"
version.workspace = true
edition.workspace = true
publish.workspace = true

# ADR-0049: the updater that replaces the program files after it exits.
[[bin]]
name = "AssetDoctorRTPT-Updater"
path = "src/bin/updater.rs"

[dependencies]
# Release list; same pinned version as ad-formats.
serde_json = "=1.0.150"
# Zip unpacking (deflate, CRC); same versions as png/flate2 already use.
miniz_oxide = "=0.9.1"
crc32fast = "=1.5.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[lints]
workspace = true
