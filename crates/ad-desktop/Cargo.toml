[package]
name = "ad-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "AssetDoctorRTPT"
path = "src/main.rs"

[dependencies]
ad-render-vulkan = { path = "../ad-render-vulkan", version = "=0.1.0" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
png = "=0.18.1"
raw-window-handle = "=0.6.2"
ad-document = { path = "../ad-document", version = "=0.1.0" }
ad-formats = { path = "../ad-formats", version = "=0.1.0" }
ad-analysis = { path = "../ad-analysis", version = "=0.1.0" }
ad-commands = { path = "../ad-commands", version = "=0.1.0" }
ad-heal = { path = "../ad-heal", version = "=0.1.0" }
glam = { version = "=0.34.3", default-features = false, features = ["std"] }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.36.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
winresource = "=0.1.34"

[lints]
workspace = true
