[package]
name = "ad-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "AssetDoctorRTPT"
path = "src/main.rs"

[dependencies]
ad-render-vulkan = { path = "../ad-render-vulkan", version = "=0.1.0" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
png = "=0.18.1"
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "=0.1.34"

[lints]
workspace = true
