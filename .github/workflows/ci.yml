name: Windows foundation
on:
  # A push of a tag vX.Y.Z publishes that release (ADR-0049 §6): the tag must
  # equal the Cargo version and point at a commit of main; the annotated tag
  # message becomes the release notes.
  push:
  pull_request:
  # Fallback: a manual run with publish = true releases the pushed main.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub release v<Cargo version> (owner approved)'
        type: boolean
        default: false
      notes:
        description: 'Release notes (shown in the program update window)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  windows-msvc:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust components
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native contracts
        run: cargo test --workspace --locked
      - name: Install dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check licenses and advisories
        run: cargo deny check
      - name: Build Windows executable
        run: cargo build --workspace --release --locked
      # The program folder: the program, its updater and the bundled
      # panoramas it looks for in assets/360.HDR next to the executable.
      # The zip and its SHA-256 are the release assets the updater uses.
      - name: Package program folder
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          if (-not $version) { throw 'No workspace version in Cargo.toml.' }
          New-Item -ItemType Directory -Force dist/AssetDoctorRTPT/assets, release | Out-Null
          Copy-Item target/release/AssetDoctorRTPT.exe, target/release/AssetDoctorRTPT-Updater.exe, LICENSE dist/AssetDoctorRTPT/
          Copy-Item -Recurse assets/360.HDR dist/AssetDoctorRTPT/assets/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
          $zip = 'release/AssetDoctorRTPT-win-x64.zip'
          Compress-Archive -Path 'dist/AssetDoctorRTPT/*' -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AssetDoctorRTPT-win-x64.zip" | Set-Content release/AssetDoctorRTPT-win-x64.sha256 -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          "AD RT-PT v$version  sha256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: AssetDoctorRTPT-win-x64
          path: release/
          if-no-files-found: error
      # Hosted build agents do not certify Vulkan presentation or installed UI.

  release:
    needs: windows-msvc
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AssetDoctorRTPT-win-x64
          path: release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows-msvc.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          # gh prints UTF-8; read it as such (Russian release notes).
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $repo = $env:GITHUB_REPOSITORY
          $tag = "v$env:VERSION"
          $notes = $env:NOTES
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # The tag names the version: it must equal the Cargo version, and
            # its commit must already be on main (main is identical to it or
            # ahead of it).
            if ($env:GITHUB_REF_NAME -cne $tag) {
              throw "Tag $env:GITHUB_REF_NAME does not match the Cargo version $tag."
            }
            $status = gh api "repos/$repo/compare/main...$env:GITHUB_SHA" --jq .status
            if ($LASTEXITCODE -ne 0) { throw 'Cannot compare the tag with main.' }
            if ($status -notin 'identical', 'behind') {
              throw "Tag $tag points at a commit that is not on main ($status)."
            }
            # Notes: the annotated tag's message (a lightweight tag has none).
            $ref = gh api "repos/$repo/git/ref/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Cannot read tag $tag." }
            if ($ref.object.type -eq 'tag') {
              $notes = gh api "repos/$repo/git/tags/$($ref.object.sha)" --jq .message
              if ($LASTEXITCODE -ne 0) { throw "Cannot read the message of tag $tag." }
              # A signed tag carries its signature after the message.
              $notes = (($notes -join "`n") -split "-----BEGIN [A-Z ]*SIGNATURE-----")[0].Trim()
            }
          }
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          if (-not $notes) { $notes = "AD RT-PT $tag" }
          gh release create $tag release/AssetDoctorRTPT-win-x64.zip release/AssetDoctorRTPT-win-x64.sha256 `
            --repo $repo --target $env:GITHUB_SHA --title "AD RT-PT $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Publishing $tag failed." }
