name: Windows foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust components
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native contracts
        run: cargo test --workspace --locked
      - name: Install dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check licenses and advisories
        run: cargo deny check
      - name: Build Windows executable
        run: cargo build --workspace --release --locked
      # The program looks for its bundled panoramas in assets/360.HDR next to
      # the executable, so the artifact is the program folder.
      - name: Stage program folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/assets | Out-Null
          Copy-Item target/release/AssetDoctorRTPT.exe, target/release/ad-render-vulkan.exe dist/
          Copy-Item -Recurse assets/360.HDR dist/assets/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-foundation
          path: dist/
          if-no-files-found: error
      # Hosted build agents do not certify Vulkan presentation or installed UI.
